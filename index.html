<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clip Stream Hub</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #121826;
            --surface-hover: #1a2236;
            --border: #232d42;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #ec4899;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; padding: 1.5rem; }
        .container { max-width: 1200px; margin: 0 auto; }

        header { text-align: center; margin-bottom: 2rem; }
        h1 { font-size: 2.2rem; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #f43f5e); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin-top: 0.4rem; }

        .search-bar { display: flex; gap: 0.8rem; margin-bottom: 1.5rem; }
        .search-input { flex: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1.2rem; color: #fff; font-size: 1rem; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--primary); }

        .stats-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; color: var(--text-muted); font-size: 0.9rem; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.2rem; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, border-color 0.2s; }
        .card:hover { transform: translateY(-4px); border-color: var(--primary); background: var(--surface-hover); }

        .card-thumb { height: 140px; background: #0f172a; display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; }
        .card-thumb::after { content: "▶"; font-size: 2rem; color: rgba(255,255,255,0.85); background: rgba(0,0,0,0.5); width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .card:hover .card-thumb::after { transform: scale(1.15); background: var(--primary); }

        .card-body { padding: 1rem; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .card-title { font-size: 0.95rem; font-weight: 600; line-height: 1.4; margin-bottom: 0.5rem; word-break: break-word; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }

        .btn-group { display: flex; gap: 0.5rem; }
        .btn { flex: 1; padding: 0.5rem 0.6rem; border-radius: 8px; font-size: 0.82rem; font-weight: 600; text-align: center; cursor: pointer; text-decoration: none; border: none; transition: background 0.2s; }
        .btn-play { background: var(--primary); color: #fff; }
        .btn-play:hover { background: var(--primary-hover); }
        .btn-raw { background: #334155; color: #e2e8f0; }
        .btn-raw:hover { background: #475569; }

        /* Modal Player */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; padding: 1rem; }
        .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 850px; overflow: hidden; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7); }
        .modal-header { padding: 1rem 1.2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .modal-title { font-size: 1.05rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90%; }
        .close-btn { font-size: 1.6rem; cursor: pointer; color: var(--text-muted); line-height: 1; }
        .close-btn:hover { color: #fff; }
        .modal-video-container { background: #000; width: 100%; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; max-height: 70vh; outline: none; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Clip Stream Hub</h1>
            <p class="subtitle">ระบบเล่นวิดีโอคลิปออนไลน์แบบสตรีมมิ่ง ไม่ต้องโหลดลงเครื่อง</p>
        </header>

        <div class="search-bar">
            <input type="text" id="search" class="search-input" placeholder="พิมพ์ชื่อคลิปเพื่อค้นหา..." oninput="handleSearch()">
        </div>

        <div class="stats-bar">
            <span id="count-info">กำลังโหลดรายการคลิป...</span>
            <a href="raw_clips.json" target="_blank" style="color: #60a5fa; text-decoration: none;">ดูไฟล์ JSON ทั้งหมด (API)</a>
        </div>

        <div class="grid" id="clipGrid"></div>
    </div>

    <!-- Modal Player -->
    <div class="modal" id="playerModal">
        <div class="modal-box">
            <div class="modal-header">
                <div class="modal-title" id="mTitle">Playing Video</div>
                <div class="close-btn" onclick="closePlayer()">&times;</div>
            </div>
            <div class="modal-video-container">
                <video id="vidPlayer" controls autoplay playsinline></video>
            </div>
        </div>
    </div>

    <script>
        let clips = [];

        async function loadClips() {
            try {
                const res = await fetch('raw_clips.json');
                const data = await res.json();
                clips = data.clips || [];
                renderGrid(clips);
                document.getElementById('count-info').innerText = `พบทั้งหมด ${clips.length} คลิป`;
            } catch(e) {
                console.error(e);
                document.getElementById('count-info').innerText = 'ไม่สามารถโหลดรายการคลิปได้';
            }
        }

        function renderGrid(list) {
            const grid = document.getElementById('clipGrid');
            if (!list.length) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: #94a3b8;">ไม่พบคลิปที่ตรงกับคำค้นหา</div>';
                return;
            }

            grid.innerHTML = list.map(c => `
                <div class="card">
                    <div class="card-thumb" onclick="openPlayer('${c.direct_source_url}', '${encodeURIComponent(c.title)}')"></div>
                    <div class="card-body">
                        <div>
                            <div class="card-title">${c.title}</div>
                            <div class="card-meta">ขนาด: ${c.size_mb} MB | #${c.id}</div>
                        </div>
                        <div class="btn-group">
                            <button class="btn btn-play" onclick="openPlayer('${c.direct_source_url}', '${encodeURIComponent(c.title)}')">▶ กดดูคลิป</button>
                            <button class="btn btn-raw" onclick="copyLink('${c.direct_source_url}')">คัดลอกลิงก์</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function handleSearch() {
            const q = document.getElementById('search').value.toLowerCase().trim();
            const filtered = clips.filter(c => c.title.toLowerCase().includes(q));
            renderGrid(filtered);
            document.getElementById('count-info').innerText = `พบ ${filtered.length} จากทั้งหมด ${clips.length} คลิป`;
        }

        function openPlayer(streamUrl, encodedTitle) {
            document.getElementById('mTitle').innerText = decodeURIComponent(encodedTitle);
            const player = document.getElementById('vidPlayer');
            player.src = streamUrl;
            document.getElementById('playerModal').style.display = 'flex';
        }

        function closePlayer() {
            const modal = document.getElementById('playerModal');
            modal.style.display = 'none';
            const player = document.getElementById('vidPlayer');
            player.pause();
            player.src = "";
        }

        function copyLink(url) {
            navigator.clipboard.writeText(url);
            alert('คัดลอกลิงก์วิดีโอเรียบร้อย!');
        }

        window.onclick = function(e) {
            if (e.target == document.getElementById('playerModal')) closePlayer();
        }

        loadClips();
    </script>
</body>
</html>
